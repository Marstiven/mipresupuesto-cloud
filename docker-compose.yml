services:
  postgres:
    image: postgres:16-alpine
    container_name: mipresupuesto-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mipresupuesto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mipresupuesto_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mipresupuesto_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: mipresupuesto-api:latest
    container_name: mipresupuesto-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5242:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=mipresupuesto_db;Username=postgres;Password=postgres
      - Jwt__Key=MiPresupuestoSuperClaveSecretaDeAltaSeguridad2026_Key123456
      - Jwt__Issuer=MiPresupuestoApi
      - Jwt__Audience=MiPresupuestoMobile
      - Jwt__DurationDays=60
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

